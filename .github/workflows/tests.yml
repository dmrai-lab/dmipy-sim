name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * 0'    # weekly, Sunday 04:00 UTC — runs the heavy MC suite
  workflow_dispatch: {}     # run the heavy MC suite on demand

env:
  # dmipy-replay 0.2 is not released: the suite runs against the commit of its main it was tested with (still versioned
  # 0.1.0, so the `dmipy-replay>=0.1,<0.3` bound is met by it). Move the ref forward as replay's main does; drop it when
  # 0.2.0 is on PyPI.
  DMIPY_REPLAY_REF: 38110c577804e8d122b556ac556d2214b5401262

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        # Eight processes per Python version, not one: the suite's memory only grows across a session (every jit is
        # built over a fresh closure, so the compile caches never hit and never shrink), and each group starts at a
        # fresh process; they run in parallel on separate runners. tools/ci_groups.py assigns every test file to one
        # group, balanced by measured time, so a new file needs no list edited.
        group: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (CPU JAX only)
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          # Base install pulls plain (CPU) jax; the [cuda12] extra is NOT installed,
          # so GitHub's CPU runners resolve JAX's CPU backend. [interop] adds dipy, which
          # nothing in the package imports -- it is the ORACLE the normative SH basis is
          # checked against (RPH.md Sec. 4.1). Without it those tests skip and the claim
          # goes unverified, so CI installs it even though [dev] deliberately does not.
          pip install "dmipy-replay @ git+https://github.com/dmrai-lab/dmipy-replay@${DMIPY_REPLAY_REF}"
          pip install -e ".[dev,interop]"
          # the torch backend of the shape-moment image is checked against the JAX one (dmipy-sim#510): the CPU wheel
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      # The suite is COMPILE-bound, not compute-bound: every jax.jit in the package is built
      # inside a function body over a fresh closure, so jit's in-memory cache can never hit
      # and the same programs are recompiled all run (#91, #93). JAX's persistent cache keys
      # on the HLO instead, and restoring it across runs is what makes that win real on CI:
      # measured locally, the full fast tier went 1,030 s cold -> 670 s warm.
      #
      # The key carries the Python version and a hash of the sources that shape the compiled
      # programs, so a change to the engine or geometries invalidates it rather than serving
      # a stale executable. `restore-keys` lets an edited run start from the nearest previous
      # cache and re-fill only what actually changed.
      - name: Restore JAX compilation cache
        uses: actions/cache@v4
        with:
          path: .jax_cache
          key: jax-${{ matrix.python-version }}-${{ hashFiles('dmipy_sim/**/*.py') }}
          restore-keys: |
            jax-${{ matrix.python-version }}-

      - name: Run tests (CPU)
        run: |
          # GitHub runners have no GPU, so pin JAX to CPU and deselect the
          # slow / GPU-only Monte Carlo tests (mark heavy tests with @pytest.mark.gpu
          # or @pytest.mark.slow as they are identified).
          python tools/ci_groups.py 8 --check
          PATHS=$(python tools/ci_groups.py 8 ${{ matrix.group }})
          JAX_PLATFORMS=cpu pytest $PATHS -q --tb=short -m "not slow and not gpu" --durations=0 --durations-min=5

      - name: Collect the whole suite
        run: |
          # every test file is collected by some invocation of this workflow (the shared ci-coverage guard reads this
          # line); the groups above are checked to partition the same files
          JAX_PLATFORMS=cpu pytest tests --collect-only -q -m "not slow and not gpu" | tail -1

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.group }}
          path: .coverage
          if-no-files-found: ignore

  slow-tests:
    # Heavy CPU Monte-Carlo validation. Excluded from every-push CI (it takes hours);
    # runs weekly on schedule or manually via workflow_dispatch so the MC physics stays covered.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies (CPU JAX only)
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install "dmipy-replay @ git+https://github.com/dmrai-lab/dmipy-replay@${DMIPY_REPLAY_REF}"
          pip install -e ".[dev,interop]"
      - name: Run full suite including slow MC (CPU)
        run: JAX_PLATFORMS=cpu pytest tests/ -q --tb=short -m "not gpu" --durations=0 --durations-min=5
