name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

env:
  # the forms and the reader at the commits this revision was tested against: dmipy-analytic main
  # through dmrai-lab/dmipy-analytic#23 (permeable_shell, its convention and surface tests), and
  # dmipy-replay at the head of dmrai-lab/dmipy-replay#35 (a time view at any diffusivity), on its main at that merge
  DMIPY_ANALYTIC_REF: be8ece558451389fbf9303981b78cfc1dade3aea
  DMIPY_REPLAY_REF: 116ee0de7ab22bdaf2c1a0994dcf0915286c8372
  # bump this number by hand to drop every group's compile cache: the key changes, the entries of
  # the older number are never read again and leave by eviction
  JAX_CACHE_EPOCH: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        # Eight processes per Python version, not one: the suite's memory only grows across a session (every jit is
        # built over a fresh closure, so the compile caches never hit and never shrink), and each group starts at a
        # fresh process; they run in parallel on separate runners. tools/ci_groups.py assigns every test file to one
        # group, balanced by measured time, so a new file needs no list edited.
        group: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (CPU JAX only)
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install "dmipy-analytic[special,jax] @ git+https://github.com/dmrai-lab/dmipy-analytic@${DMIPY_ANALYTIC_REF}"
          pip install "dmipy-replay[torch] @ git+https://github.com/dmrai-lab/dmipy-replay@${DMIPY_REPLAY_REF}"
          # Base install pulls plain (CPU) jax; the [cuda12] extra is NOT installed,
          # so GitHub's CPU runners resolve JAX's CPU backend. [interop] adds dipy, which
          # nothing in the package imports -- it is the ORACLE the normative SH basis is
          # checked against (RPH.md Sec. 4.1). Without it those tests skip and the claim
          # goes unverified, so CI installs it even though [dev] deliberately does not.
          pip install -e ".[dev,interop]"
          # the torch backend of the shape-moment image is checked against the JAX one (dmipy-sim#510): the CPU wheel
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      # The suite is COMPILE-bound, not compute-bound: every jax.jit in the package is built
      # inside a function body over a fresh closure, so jit's in-memory cache can never hit
      # and the same programs are recompiled all run (#91, #93). JAX's persistent cache keys
      # on the HLO instead, and restoring it across runs is what makes that win real on CI:
      # measured locally, the full fast tier went 1,030 s cold -> 670 s warm.
      #
      # The cache is one entry per Python version AND per test group. With one key per version,
      # all eight groups of that version compute the same key: the first job to end well writes
      # the entry and the other seven never save their own programs. The key below therefore
      # carries the group next to the Python version, the epoch and a hash of the sources that
      # shape the compiled programs, so a change to the engine or geometries misses the exact
      # key, restores the newest entry of the same group and epoch (restore-keys below, the
      # group number followed by a dash, so g1- never matches another group) and the save
      # writes a new entry under the new hash: only what changed is re-filled.
      #
      # The save is its own step, directly after the test step, and its condition begins with
      # always(): it also runs after a failed or a timed-out test step, which the combined
      # action's post-job save does not (that one is skipped when the job fails or is
      # cancelled). The save still runs only when the test step actually ran (its outcome is
      # not 'skipped'), only on refs/heads/main (a pull request reads the entries main saved
      # and never writes its own), and only when the exact key missed, so an existing entry is
      # never written again.
      #
      # Size budget: sixteen live entries per source hash (two Python versions times eight
      # groups), each expected at about one eighth of a whole-version entry, about 0.18 GB for
      # 3.11 and 0.04 GB for 3.12 if the programs split evenly -- a guess until measured,
      # because a whole-version entry holds whichever group wrote it, not an even share. The
      # repository store is capped at 10 GB and GitHub evicts the least recently used entries
      # above that cap, so entries of older source hashes and of older epochs leave by
      # eviction; no step here deletes anything and no extra permission is needed. Accepted
      # consequence of having no delete step: an entry written by a main run whose test step
      # failed or timed out stays partial until the sources change or the epoch is bumped; it
      # still holds more than the combined action stores after a failed run, which is nothing.
      - name: Restore JAX compilation cache
        id: jaxcache
        uses: actions/cache/restore@v4
        with:
          path: .jax_cache
          key: jax-${{ matrix.python-version }}-g${{ matrix.group }}-e${{ env.JAX_CACHE_EPOCH }}-${{ hashFiles('dmipy_sim/**/*.py') }}
          restore-keys: |
            jax-${{ matrix.python-version }}-g${{ matrix.group }}-e${{ env.JAX_CACHE_EPOCH }}-

      - name: Run tests (CPU)
        id: tests
        run: |
          # GitHub runners have no GPU, so JAX is pinned to the CPU and the `gpu` tier (gpu-tier.yml) is deselected.
          # A test that is merely expensive is slimmed or deleted, not marked (tests/test_no_tiers.py).
          python tools/ci_groups.py 8 --check
          PATHS=$(python tools/ci_groups.py 8 ${{ matrix.group }})
          JAX_PLATFORMS=cpu pytest $PATHS -q --tb=short -m "not gpu"

      - name: Save JAX compilation cache
        if: always() && steps.tests.outcome != 'skipped' && github.ref == 'refs/heads/main' && steps.jaxcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .jax_cache
          key: jax-${{ matrix.python-version }}-g${{ matrix.group }}-e${{ env.JAX_CACHE_EPOCH }}-${{ hashFiles('dmipy_sim/**/*.py') }}

      - name: Collect the whole suite
        run: |
          # every test file is collected by some invocation of this workflow (the shared ci-coverage guard reads this
          # line); the groups above are checked to partition the same files
          JAX_PLATFORMS=cpu pytest tests --collect-only -q -m "not gpu" | tail -1

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.group }}
          path: .coverage
          if-no-files-found: ignore

  recorded-bits:
    # Recorded bits are bits of one JAX build (jax / jaxlib 0.10.2, tests/recorded_bits.py RECORDED_WITH) and of the
    # arithmetic XLA's CPU backend emits for a family of CPUs: the all-myelinated walks, and the walk with and without
    # the trial record. The recorded values are kept per family, selected by the canary (a small fixed walk;
    # tests/recorded_bits.py FAMILIES). This job installs that build, prints the runner's CPU model, its flags, numpy's
    # SIMD dispatch and the canary, and runs the tests named test_recorded_bits_* with DMIPY_SIM_RECORDED_BITS=1, which
    # makes a canary of no recorded family a failure that names it (elsewhere such a host skips). On a failure it prints
    # this runner's entry (tools/record_recorded_bits.py), the values a new family would be recorded with.
    runs-on: ubuntu-latest
    env:
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies (the recording JAX build, CPU)
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install "dmipy-analytic[special,jax] @ git+https://github.com/dmrai-lab/dmipy-analytic@${DMIPY_ANALYTIC_REF}"
          pip install "dmipy-replay @ git+https://github.com/dmrai-lab/dmipy-replay@${DMIPY_REPLAY_REF}"
          pip install -e . "jax==0.10.2" "jaxlib==0.10.2"
      - name: The runner's CPU and canary
        run: |
          grep -m1 "^model name" /proc/cpuinfo
          grep -m1 "^flags" /proc/cpuinfo
          python -c "import jax, jaxlib, numpy; print('jax', jax.__version__, 'jaxlib', jaxlib.__version__, 'numpy', numpy.__version__); numpy.show_runtime()"
          python -c "from tests.recorded_bits import FAMILIES, canary; c = canary(); print('canary', c, 'recorded family' if c in FAMILIES else 'NO recorded family')"
      - name: Run the recorded-bits tests
        shell: bash
        run: |
          set -o pipefail
          python -c "import jax, jaxlib; assert (jax.__version__, jaxlib.__version__) == ('0.10.2', '0.10.2'), (jax.__version__, jaxlib.__version__)"
          status=0
          DMIPY_SIM_RECORDED_BITS=1 pytest tests/geometry/test_mixed_myelinated_plain_cell.py tests/test_trial_record.py -k "test_recorded_bits" -q -rs --tb=short | tee out.txt || status=$?
          if [ "$status" -eq 0 ] && grep -q "5 passed" out.txt && ! grep -q "skipped" out.txt; then exit 0; fi
          # a recorded test failed (or was skipped): print this runner's entry, the values its family would be recorded with
          python tools/record_recorded_bits.py || true
          exit 1
