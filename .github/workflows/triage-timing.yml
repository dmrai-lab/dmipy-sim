# TEMPORARY: times every gpu-marked test of the pre-triage tree on a CPU runner (reverted before the PR is ready).
name: Triage timing
on:
  push:
    branches: [ tests/tier-triage ]
  workflow_dispatch: {}
jobs:
  time:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        file: ["tests/geometry/test_box_1d.py", "tests/geometry/test_curved_step_rule.py", "tests/geometry/test_cylinder.py", "tests/geometry/test_ellipsoid.py", "tests/geometry/test_ellipsoid_permeability.py", "tests/geometry/test_mesh_acceleration_invariance.py", "tests/geometry/test_mesh_grid_sizing.py", "tests/geometry/test_mesh_mc.py", "tests/geometry/test_myelin.py", "tests/geometry/test_myelin_walls.py", "tests/geometry/test_packed_cylinders.py", "tests/geometry/test_packed_cylinders_permeability.py", "tests/geometry/test_packed_spheres.py", "tests/geometry/test_packed_walls.py", "tests/geometry/test_permeability_crossing.py", "tests/geometry/test_permeable_crossings.py", "tests/geometry/test_sphere.py", "tests/geometry/test_sphere_permeability.py", "tests/physics/test_permeability.py", "tests/physics/test_sgp_pore_sizes.py", "tests/physics/test_surface_relaxivity.py", "tests/physics/test_t2_walker_parity.py", "tests/replay/test_hub_windows.py", "tests/spectrum/test_label_volumes_slow.py", "tests/spectrum/test_packs_slow.py", "tests/spectrum/test_strands_slow.py", "tests/test_bloch_permeation.py", "tests/test_bloch_sub_steps.py", "tests/test_coefficient_walk.py", "tests/test_compartment_ids.py", "tests/test_compartment_tagging.py", "tests/test_compression.py", "tests/test_engine_dispatch.py", "tests/test_free_1d.py", "tests/test_free_3d.py", "tests/test_free_ogse.py", "tests/test_general_waveform.py", "tests/test_gpu_and_batching.py", "tests/test_mixture.py", "tests/test_mt_binding.py", "tests/test_mt_mesh_binding.py", "tests/test_mt_storage.py", "tests/test_mt_zspectrum.py", "tests/test_pose_series.py", "tests/test_replay_fields_mt.py", "tests/test_replay_parity.py", "tests/test_seed_pool_plumbing.py", "tests/test_step_law_report.py", "tests/test_sub_step_dispatch.py", "tests/test_t2.py", "tests/test_walk_sub_steps.py", "tests/validation/test_cross_engine_parity.py", "tests/validation/test_ling_sand_packs.py", "tests/validation/test_permeability_ladder.py", "tests/validation/test_surface_relaxivity_ladder.py", "tests/validation/test_talabi_rocks.py"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 739a1e2276f0650331fb35828ea7941f4a2ce92d
      - uses: actions/checkout@v4
        with:
          path: triage-tool
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e ".[dev,interop]"
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python triage-tool/tools/triage_ci_timing.py ${{ matrix.file }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: triage-${{ strategy.job-index }}
          path: triage-*.jsonl
