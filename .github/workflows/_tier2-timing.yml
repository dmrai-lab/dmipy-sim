# TEMPORARY (removed before the pull request is ready): times tests on a hosted CPU runner, one job per entry of
# tools/_tier2_timing_plan.json. Runs only for a push whose head commit message says [time].
name: Tier-2 timing
on:
  push:
    branches: [ tests/tier2-fit ]
    paths: [ tools/_tier2_timing.py, tools/_tier2_timing_plan.json ]
jobs:
  plan:
    if: ${{ contains(github.event.head_commit.message, '[time]') }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          echo "matrix=$(python3 tools/_tier2_timing_plan.py)" >> "$GITHUB_OUTPUT"
  time:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (as tests.yml does)
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          REF=$(grep -E '^\s*DMIPY_REPLAY_REF:' .github/workflows/tests.yml | awk '{print $2}')
          pip install "dmipy-replay @ git+https://github.com/dmrai-lab/dmipy-replay@${REF}"
          pip install -e ".[dev,interop]"
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Time
        env:
          SPEC: ${{ matrix.spec }}
        run: python tools/_tier2_timing.py "$SPEC"
