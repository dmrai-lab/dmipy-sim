[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dmipy-sim"
version = "3.0.0"
description = "dmipy-sim: GPU Monte-Carlo diffusion-MRI simulator (the forward-truth engine)"
readme = "README.md"
license = {text = "AGPL-3.0-only OR LicenseRef-Commercial"}  # dual-licensed; see LICENSING.md
authors = [
    { name = "Rutger Fick", email = "fick.rutger@gmail.com" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.10"
dependencies = [
    "jax>=0.6.2",
    "numpy>=2.0",
    "dmipy-replay>=0.1,<0.3",  # the reader: acquisitions, the replay, the Hub client
    "scipy>=1.10",       # replay: DCT/low-rank compression + compiled-scheme forward; susceptibility field-map sampling
    "safetensors>=0.4",  # replay: .rpk container I/O (dmipy_sim.replay)
    "threadpoolctl>=3.1",  # the CPU thread cap import dmipy_sim applies (dmipy_replay._blas, #700; the build whose multithreaded LAPACK hangs, #564)
]

[project.optional-dependencies]
# The substrate bank on the Hugging Face Hub: huggingface_hub pulls and publishes packs (dmipy_sim.replay.hub,
# replay.publish). The .rpk container itself (safetensors) is a dependency above.
bank = [
    "huggingface_hub>=0.20",
]
# GPU support: installs jax-cuda12-plugin and all nvidia-*-cu12 wheels.
# After installing, the venv's activate script must export LD_LIBRARY_PATH
# so the dynamic linker can resolve transitive CUDA library dependencies
# (e.g. libcusparse.so.12 → libnvJitLink.so.12). See README for details.
# The torch backends of the shape-moment image (dmipy-sim#510) and the closed-form pose expansion (#603): PyTorch
# only, for Hugging Face's shared GPU pool.
torch = [
    "dmipy-replay[torch]>=0.1,<0.3",
]
cuda12 = [
    "jax[cuda12]>=0.6.2",
]
dev = [
    "pytest>=7.0",
    "matplotlib>=3.5",   # physics/validation tests plot diagnostics (Agg backend)
    # the mesh tests load and generate PLY meshes; the segmented-image readers are TESTED rather than assumed to
    # work (tests/geometry/test_label_volume.py)
    "dmipy-sim[mesh,images]",
]

# ORACLE-ONLY, and deliberately NOT in `dev`. Nothing in dmipy_sim imports dipy -- the normative
# spherical-harmonic basis (RPH.md Sec. 4.1) is implemented here as `replay.so3.real_sh`. But "real SH"
# alone pins no convention: MRtrix/legacy-Tournier is not orthonormal and Descoteaux is a signed
# m -> -m permutation, so the claim that our basis IS dipy's non-legacy `tournier` can only be
# checked against dipy itself. Those few tests skip without it; CI installs this extra so the
# normative claim is verified rather than assumed, while `[dev]` stays free of it.
interop = [
    "dipy>=1.8",
]
# Triangular-mesh loading (dmipy_sim.load_ply / Mesh.from_ply) and exact containment
# (susceptibility_field.mesh_contains). The Mesh geometry itself needs only numpy/jax; trimesh is required
# to READ mesh files. trimesh[easy] rather than bare trimesh: mesh_contains uses ray parity, whose engine needs
# rtree, and trimesh.repair.fill_holes needs networkx. Both are trimesh EXTRAS, so a bare install imports fine and
# then raises ModuleNotFoundError deep inside a containment call. networkx is ALSO named directly (#626): a venv
# built without resolving trimesh's own bracketed sub-extras still gets it.
mesh = [
    "trimesh[easy]>=4.0",
    "networkx>=2.8",
]
# Segmented-image containers (dmipy_sim.io.label_volume). NRRD and MetaImage are read with the
# standard library and need nothing; NIfTI needs nibabel, a TIFF stack tifffile, HDF5 h5py. Each
# reader names its own missing package when asked for a format it cannot open.
images = [
    "nibabel>=5.0",
    "tifffile>=2023.1",
    "h5py>=3.8",
]
# The cross-engine flagship example (examples/canonical_wm_parity_from_sim.py) additionally needs the analytical
# engine dmipy-fit, a release that imports the reader's names from dmipy-replay (2.3 and earlier import them from
# dmipy-sim); so do the Karger and brain-from-CSD tests, which skip without it. It is an OPTIONAL example dependency
# only -- the dmipy-sim package itself never imports dmipy-fit (the fit -> sim dependency is one-directional).
examples = [
    "dmipy-fit>=3,<4",
]
# Pulseq (.seq) interoperability: from_pulseq / to_pulseq (dmipy_sim.sequences.pulseq).
# Install isolated from the numpy/jax stack:  pip install --no-deps pypulseq
pulseq = [
    "pypulseq>=1.5.0",
]

[project.urls]
Homepage = "https://dmipy.org"
Repository = "https://github.com/dmrai-lab/dmipy-sim"

[tool.setuptools.packages.find]
where = ["."]
include = ["dmipy_sim*"]

# Ship non-Python runtime data files (e.g. sequences/scanner_constants.json) inside the wheel;
# packages.find selects the .py packages but data files must be declared explicitly.
[tool.setuptools.package-data]
"*" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "gpu: tier 2, run on a GPU by .github/workflows/gpu-tier.yml (deselected on the CPU runners with -m 'not gpu')",
]
filterwarnings = [
    # A sub-step longer than the collision-lookup cell means the walk misses walls, so any confinement,
    # escape or exchange number measured past that bound is an artefact of the lookup rather than physics.
    # It is a warning at runtime (a caller may knowingly trade accuracy for speed) and an ERROR here, so no
    # test can quietly assert a number from the unsound regime. Measured on a permeable mesh sphere per 1 ms:
    # step/cell 0.25 -> 0.00% escaped, 1.79 -> 0.05%, 3.31 -> 4.85%, 6.63 -> 26.2%. A 6.6-cell step once read
    # as a 90% walker loss and was filed as a permeability bug (dmrai-lab/dmipy-sim#65) before being traced
    # to the step choice.
    "error:.*collision-lookup cell.*:UserWarning",
]
# Pass --heavy to run all MC tests at 10× walkers (1 000 000) for systematic
# bias measurement.  Example:
#   LD_LIBRARY_PATH=/usr/local/cuda/lib64:$LD_LIBRARY_PATH \
#   pytest --heavy tests/test_step16_exterior_relaxivity.py
